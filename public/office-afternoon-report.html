<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBY Bus Office - Afternoon Report</title>
    <link rel="stylesheet" href="/office.css" />
    <style>
      .report-shell { max-width: 640px; margin: 0 auto; padding: 14px; }
      .report-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 14px; }
      .report-card h2 { margin: 0 0 10px; font-size: 18px; }
      .report-card h3 { margin: 14px 0 8px; font-size: 15px; }
      .report-card p.hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .report-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .report-table th, .report-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      .report-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
      .report-table td.time { font-weight: 800; white-space: nowrap; }
      .report-table td.waiting { color: var(--muted); font-style: italic; }
      .empty-note { color: var(--muted); font-size: 14px; padding: 8px 0; }
      .date-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
      .date-row input[type='date'] { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <main class="office-shell">
      <header class="office-header">
        <div>
          <div class="eyebrow">TBY Bus Office</div>
          <h1>Afternoon Dismissal Report</h1>
        </div>
        <div class="header-right">
          <nav class="tabs">
            <a href="/office/from-school">Routes</a>
            <a href="/office/morning-report">Morning Report</a>
            <a href="/office/route-history">Route History</a>
          </nav>
          <div id="updated" class="updated"></div>
        </div>
      </header>

      <section id="pin-box" class="pin-box hidden">
        <h2>Office PIN</h2>
        <p>Enter the office PIN to view the afternoon dismissal report.</p>
        <form id="pin-form">
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" />
          <button type="submit">Open</button>
        </form>
      </section>

      <section id="message" class="message hidden"></section>

      <div id="report-content" class="report-shell hidden">
        <div class="report-card">
          <p class="hint" id="coverage-hint">Every dismissal route that ran that day, in the order each bus left.</p>
          <div class="date-row">
            <label for="date-input">Date</label>
            <input id="date-input" type="date" />
            <button id="reload-btn" type="button">Reload</button>
          </div>
        </div>

        <div id="sections"></div>
      </div>
    </main>

    <script>
      let officePin = window.localStorage.getItem('tbyOfficePin') || '';

      function todayDateString() {
        return new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      }

      function showMessage(text, type = 'info') {
        const box = document.getElementById('message');
        box.textContent = text;
        box.className = `message ${type}`;
        box.classList.remove('hidden');
        window.clearTimeout(showMessage.timer);
        showMessage.timer = window.setTimeout(() => box.classList.add('hidden'), 6000);
      }

      function showPinBox() {
        document.getElementById('pin-box').classList.remove('hidden');
        document.getElementById('report-content').classList.add('hidden');
      }

      function hidePinBox() {
        document.getElementById('pin-box').classList.add('hidden');
        document.getElementById('report-content').classList.remove('hidden');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderSection(section) {
        const card = document.createElement('div');
        card.className = 'report-card';

        const heading = document.createElement('h2');
        heading.textContent = section.label;
        card.appendChild(heading);

        const departedWrap = document.createElement('div');
        if (!section.departed.length) {
          departedWrap.innerHTML = '<p class="empty-note">No buses have departed yet.</p>';
        } else {
          const rows = section.departed
            .map((route, index) => `
              <tr>
                <td>${index + 1}</td>
                <td>${escapeHtml(route.name)}</td>
                <td>${escapeHtml(route.routeName)}</td>
                <td>${escapeHtml(route.company)}</td>
                <td class="time">${escapeHtml(route.departureTimeFormatted)}</td>
              </tr>
            `)
            .join('');
          departedWrap.innerHTML = `
            <table class="report-table">
              <thead><tr><th>#</th><th>Route</th><th>Route Name</th><th>Company</th><th>Departed</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        }
        card.appendChild(departedWrap);

        if (section.notDeparted.length) {
          const heading2 = document.createElement('h3');
          heading2.textContent = 'Not yet departed';
          card.appendChild(heading2);
          const rows = section.notDeparted
            .map((route) => `<tr><td>${escapeHtml(route.name)}</td><td>${escapeHtml(route.routeName)}</td><td>${escapeHtml(route.company)}</td><td class="waiting">Waiting</td></tr>`)
            .join('');
          const table = document.createElement('div');
          table.innerHTML = `
            <table class="report-table">
              <thead><tr><th>Route</th><th>Route Name</th><th>Company</th><th>Status</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
          card.appendChild(table);
        }

        return card;
      }

      function renderReport(report) {
        document.getElementById('date-input').value = report.serviceDate;
        const sectionsBox = document.getElementById('sections');
        sectionsBox.innerHTML = '';
        if (!report.sections.length) {
          sectionsBox.innerHTML = '<div class="report-card"><p class="empty-note">No dismissal routes are scheduled for this date.</p></div>';
          return;
        }
        report.sections.forEach((section) => sectionsBox.appendChild(renderSection(section)));
      }

      async function loadReport() {
        if (!officePin) {
          showPinBox();
          return;
        }
        const date = document.getElementById('date-input').value || undefined;
        try {
          const url = new URL('/api/office/afternoon-report', window.location.origin);
          if (date) url.searchParams.set('date', date);
          const response = await fetch(url, { cache: 'no-store', headers: { 'x-office-pin': officePin } });
          if (response.status === 401) {
            officePin = '';
            window.localStorage.removeItem('tbyOfficePin');
            showPinBox();
            showMessage('Invalid PIN. Please try again.', 'error');
            return;
          }
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not load the report.');
          hidePinBox();
          renderReport(data);
          document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      document.getElementById('reload-btn').addEventListener('click', loadReport);

      document.getElementById('pin-form').addEventListener('submit', (event) => {
        event.preventDefault();
        officePin = document.getElementById('pin-input').value.trim();
        window.localStorage.setItem('tbyOfficePin', officePin);
        loadReport();
      });

      document.getElementById('date-input').value = todayDateString();
      loadReport();
    </script>
  </body>
</html>
