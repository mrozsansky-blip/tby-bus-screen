<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBY Bus Office - Route History</title>
    <link rel="stylesheet" href="/office.css" />
    <style>
      .report-shell { max-width: 640px; margin: 0 auto; padding: 14px; }
      .report-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 14px; }
      .report-card h2 { margin: 0 0 10px; font-size: 18px; }
      .report-card p.hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
      .report-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .report-table th, .report-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      .report-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
      .report-table td.time { font-weight: 800; white-space: nowrap; }
      .report-table td.waiting { color: var(--muted); font-style: italic; }
      .empty-note { color: var(--muted); font-size: 14px; padding: 8px 0; }
      .picker-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px; }
      .picker-row select, .picker-row input[type='date'] { font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); }
      .picker-row select { flex: 1; min-width: 180px; }
    </style>
  </head>
  <body>
    <main class="office-shell">
      <header class="office-header">
        <div>
          <div class="eyebrow">TBY Bus Office</div>
          <h1>Route History</h1>
        </div>
        <div class="header-right">
          <nav class="tabs">
            <a href="/office/from-school">Routes</a>
            <a href="/office/morning-report">Morning Report</a>
            <a href="/office/afternoon-report">Afternoon Report</a>
          </nav>
          <div id="updated" class="updated"></div>
        </div>
      </header>

      <section id="pin-box" class="pin-box hidden">
        <h2>Office PIN</h2>
        <p>Enter the office PIN to view route history.</p>
        <form id="pin-form">
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" />
          <button type="submit">Open</button>
        </form>
      </section>

      <section id="message" class="message hidden"></section>

      <div id="report-content" class="report-shell hidden">
        <div class="report-card">
          <p class="hint">Pick a route to see its recorded time every school day, from the start of its history through the date below.</p>
          <div class="picker-row">
            <select id="route-select"><option value="">Loading routes…</option></select>
          </div>
          <div class="picker-row" style="margin-top: 10px;">
            <label for="through-input">Through</label>
            <input id="through-input" type="date" />
            <button id="load-btn" type="button">Load</button>
          </div>
        </div>

        <div class="report-card">
          <h2 id="route-heading">Days</h2>
          <div id="days-box"></div>
        </div>
      </div>
    </main>

    <script>
      let officePin = window.localStorage.getItem('tbyOfficePin') || '';

      function todayDateString() {
        return new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      }

      function showMessage(text, type = 'info') {
        const box = document.getElementById('message');
        box.textContent = text;
        box.className = `message ${type}`;
        box.classList.remove('hidden');
        window.clearTimeout(showMessage.timer);
        showMessage.timer = window.setTimeout(() => box.classList.add('hidden'), 6000);
      }

      function showPinBox() {
        document.getElementById('pin-box').classList.remove('hidden');
        document.getElementById('report-content').classList.add('hidden');
      }

      function hidePinBox() {
        document.getElementById('pin-box').classList.add('hidden');
        document.getElementById('report-content').classList.remove('hidden');
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function routeOptionLabel(route) {
        const parts = [route.name];
        if (route.routeName) parts.push(`(${route.routeName})`);
        if (route.company) parts.push(`- ${route.company}`);
        return parts.join(' ');
      }

      async function loadRoutes() {
        const select = document.getElementById('route-select');
        const savedRouteId = window.localStorage.getItem('tbyRouteHistoryRouteId') || '';
        try {
          const response = await fetch('/api/office/routes', { cache: 'no-store', headers: { 'x-office-pin': officePin } });
          if (response.status === 401) {
            officePin = '';
            window.localStorage.removeItem('tbyOfficePin');
            showPinBox();
            showMessage('Invalid PIN. Please try again.', 'error');
            return;
          }
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not load the route list.');
          select.innerHTML = data.routes.map((route) => `<option value="${escapeHtml(route.id)}">${escapeHtml(routeOptionLabel(route))}</option>`).join('');
          if (savedRouteId && data.routes.some((route) => route.id === savedRouteId)) select.value = savedRouteId;
          if (select.value) loadHistory();
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      function renderHistory(report) {
        document.getElementById('route-heading').textContent = `${report.route.name}${report.route.routeName ? ' — ' + report.route.routeName : ''} — Days`;
        const box = document.getElementById('days-box');
        if (!report.days.length) {
          box.innerHTML = '<p class="empty-note">No history recorded for this route yet.</p>';
          return;
        }
        const rows = report.days
          .map((day) => `
            <tr>
              <td>${escapeHtml(day.serviceDate)}</td>
              <td>${escapeHtml(day.screenLabel)}</td>
              <td class="${day.eventTimeFormatted ? 'time' : 'waiting'}">${escapeHtml(day.eventTimeFormatted || day.status)}</td>
            </tr>
          `)
          .join('');
        box.innerHTML = `
          <table class="report-table">
            <thead><tr><th>Date</th><th>Screen</th><th>Time</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      async function loadHistory() {
        if (!officePin) {
          showPinBox();
          return;
        }
        const routeId = document.getElementById('route-select').value;
        if (!routeId) return;
        window.localStorage.setItem('tbyRouteHistoryRouteId', routeId);
        const through = document.getElementById('through-input').value || undefined;
        try {
          const url = new URL('/api/office/route-history', window.location.origin);
          url.searchParams.set('routeId', routeId);
          if (through) url.searchParams.set('through', through);
          const response = await fetch(url, { cache: 'no-store', headers: { 'x-office-pin': officePin } });
          if (response.status === 401) {
            officePin = '';
            window.localStorage.removeItem('tbyOfficePin');
            showPinBox();
            showMessage('Invalid PIN. Please try again.', 'error');
            return;
          }
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not load route history.');
          hidePinBox();
          renderHistory(data);
          document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
        } catch (error) {
          showMessage(error.message, 'error');
        }
      }

      document.getElementById('load-btn').addEventListener('click', loadHistory);
      document.getElementById('route-select').addEventListener('change', loadHistory);

      document.getElementById('pin-form').addEventListener('submit', (event) => {
        event.preventDefault();
        officePin = document.getElementById('pin-input').value.trim();
        window.localStorage.setItem('tbyOfficePin', officePin);
        loadRoutes();
      });

      document.getElementById('through-input').value = todayDateString();
      if (officePin) loadRoutes();
      else showPinBox();
    </script>
  </body>
</html>
