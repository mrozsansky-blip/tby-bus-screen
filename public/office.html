<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBY Bus Office</title>
    <link rel="stylesheet" href="/office.css" />
  </head>
  <body>
    <main class="office-shell">
      <header class="office-header">
        <div>
          <div class="eyebrow">TBY Bus Office</div>
          <h1 id="page-title">Office Controls</h1>
        </div>
        <div class="header-right">
          <nav class="tabs">
            <a href="/office/morning" data-screen="morning">Morning</a>
            <a href="/office/pri-dismissal" data-screen="pri-dismissal">PRI</a>
            <a href="/office/from-school" data-screen="from-school">From School</a>
            <a href="/office/friday-dismissal" data-screen="friday-dismissal">Friday</a>
          </nav>
          <div id="updated" class="updated">Loading...</div>
        </div>
      </header>

      <section id="pin-box" class="pin-box hidden">
        <h2>Office PIN</h2>
        <p>Enter the office PIN to update buses.</p>
        <form id="pin-form">
          <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" />
          <button type="submit">Open Office Page</button>
        </form>
      </section>

      <section id="override-bar" class="override-bar hidden">
        <span id="override-label" class="override-label">Public screen: Auto</span>
        <div class="override-buttons">
          <button class="mini-btn" data-override="auto">Auto</button>
          <button class="mini-btn" data-override="from-school">From School</button>
          <button class="mini-btn" data-override="pri-dismissal">PRI</button>
          <button class="mini-btn" data-override="friday-dismissal">Friday</button>
        </div>
      </section>

      <section id="message" class="message hidden"></section>
      <section id="grid" class="route-grid compact"></section>
    </main>

    <div id="template-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="template-modal-title">Text Parents</h3>
        <p class="modal-subtitle" id="template-modal-subtitle"></p>
        <div id="template-modal-list"></div>
        <button type="button" class="modal-close-btn" data-modal-close>Cancel</button>
      </div>
    </div>

    <script>
      const SCREEN_TITLES = {
        morning: 'Morning Bus Arrival',
        'from-school': 'From School Dismissal',
        'pri-dismissal': 'PRI Dismissal',
        'friday-dismissal': 'Friday Dismissal',
      };

      const STATUS_ORDER = ['Waiting', 'Arrived', 'Loading', 'Departed'];
      let officePin = window.localStorage.getItem('tbyOfficePin') || '';
      let currentScreen = getScreenKey();
      let currentSpots = [];
      let busy = false;
      let loading = false;
      let loadController = null;
      let loadTimer = null;

      function getScreenKey() {
        const path = window.location.pathname.replace(/^\/office\/?/, '') || 'from-school';
        if (['morning', 'from-school', 'pri-dismissal', 'friday-dismissal'].includes(path)) return path;
        return 'from-school';
      }

      function setTitle() {
        const title = SCREEN_TITLES[currentScreen] || 'Office Controls';
        document.getElementById('page-title').textContent = title;
        document.title = `TBY Bus Office - ${title}`;
        document.querySelectorAll('.tabs a').forEach((link) => {
          link.classList.toggle('active', link.dataset.screen === currentScreen);
        });
      }

      function showMessage(text, type = 'info') {
        const box = document.getElementById('message');
        box.textContent = text;
        box.className = `message ${type}`;
        box.classList.remove('hidden');
        window.clearTimeout(showMessage.timer);
        showMessage.timer = window.setTimeout(() => box.classList.add('hidden'), 5000);
      }

      function showPinBox() {
        document.getElementById('pin-box').classList.remove('hidden');
        document.getElementById('override-bar').classList.add('hidden');
        document.getElementById('grid').innerHTML = '';
      }

      function hidePinBox() {
        document.getElementById('pin-box').classList.add('hidden');
        document.getElementById('override-bar').classList.remove('hidden');
      }

      function formatTime(value) {
        if (!value) return '--';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      function formatUpdated(value) {
        if (!value) return 'Updated --';
        return `Updated ${formatTime(value)}`;
      }

      function renderSpotSelect(route) {
        if (currentScreen === 'morning') return '';
        // A spot already claimed by another bus isn't offered as a choice here - only this
        // route's own current spot (if any) and spots nobody else has taken show up.
        const available = currentSpots.filter((spot) => !spot.takenByRouteId || spot.takenByRouteId === route.id);
        const options = ['<option value="">No spot</option>']
          .concat(available.map((spot) => `<option value="${escapeHtml(spot.id)}" ${spot.id === route.spotId ? 'selected' : ''}>${escapeHtml(spot.name)}</option>`))
          .join('');
        return `
          <label class="spot-row compact-spot">
            <span>Spot</span>
            <select data-action="spot" data-id="${escapeHtml(route.id)}">${options}</select>
          </label>
        `;
      }

      function renderStatusButtons(route) {
        const buttons = STATUS_ORDER.map((status) => {
          const active = route.status === status;
          return `<button class="mini-btn ${active ? 'active' : ''}" data-action="status" data-id="${escapeHtml(route.id)}" data-status="${escapeHtml(status)}">${escapeHtml(status)}</button>`;
        }).join('');
        return `<div class="manual-buttons compact-buttons">${buttons}</div>`;
      }

      function renderNotifyButton(route) {
        // Morning is waiting for buses to arrive, not dismissing them - no text button there.
        // Every dismissal screen (including Friday, whose page also lists AM routes reused for
        // that day's early dismissal) gets the full template picker.
        if (currentScreen === 'morning') return '';
        const texted = route.textsSentToday > 0;
        const button = `<button class="mini-btn notify-btn ${texted ? 'texted' : ''}" data-action="notify" data-id="${escapeHtml(route.id)}" data-name="${escapeHtml(route.name)}">${texted ? 'Text Parents (sent) - Send Another' : 'Text Parents'}</button>`;
        if (!texted) return button;
        const countNote = route.textsSentToday > 1 ? ` (+${route.textsSentToday - 1} more today)` : '';
        const note = `
          <div class="text-sent-note">
            ✓ "${escapeHtml(truncate(route.lastTextMessage, 70))}"${route.lastTextRecipientCount ? ` — ${route.lastTextRecipientCount} texted` : ''}${countNote}
          </div>
        `;
        return button + note;
      }

      function truncate(value, max) {
        const text = String(value || '');
        return text.length > max ? `${text.slice(0, max - 1)}…` : text;
      }

      function renderRoutes(routes) {
        const grid = document.getElementById('grid');
        if (!routes.length) {
          grid.innerHTML = '<div class="empty">No routes are set for this page.</div>';
          return;
        }

        grid.innerHTML = routes.map((route) => {
          const status = route.status || 'Waiting';
          const statusClass = status.toLowerCase().replace(/\s+/g, '-');
          return `
            <article class="route-card ${statusClass}">
              <div class="card-top compact-top">
                <div class="bus-name">${escapeHtml(route.name)}</div>
                <div class="status-pill">${escapeHtml(status)}</div>
              </div>

              ${renderSpotSelect(route)}

              <div class="time-grid compact-times">
                <div><span>Arr</span><strong>${escapeHtml(formatTime(route.lastArrival))}</strong></div>
                <div><span>Dep</span><strong>${escapeHtml(formatTime(route.lastDeparture))}</strong></div>
              </div>

              ${renderStatusButtons(route)}
              ${renderNotifyButton(route)}
            </article>
          `;
        }).join('');
      }

      async function api(path, options = {}) {
        const separator = path.includes('?') ? '&' : '?';
        const controller = options.controller;
        const cleanOptions = { ...options };
        delete cleanOptions.controller;

        const response = await fetch(`${path}${separator}pin=${encodeURIComponent(officePin)}`, {
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json', 'x-office-pin': officePin },
          signal: controller ? controller.signal : undefined,
          ...cleanOptions,
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(data.error || 'Something went wrong.');
          error.status = response.status;
          throw error;
        }
        return data;
      }

      async function loadOffice(force = false) {
        if (!officePin) {
          showPinBox();
          return;
        }
        if (loading && !force) return;
        if (loadController) loadController.abort();
        loadController = new AbortController();
        loading = true;

        try {
          const data = await api(`/api/office/${currentScreen}`, { controller: loadController });
          hidePinBox();
          currentSpots = data.spots || [];
          renderRoutes(data.routes || []);
          document.getElementById('updated').textContent = formatUpdated(data.updatedAt);
        } catch (error) {
          if (error.name === 'AbortError') return;
          if (error.status === 401) {
            officePin = '';
            window.localStorage.removeItem('tbyOfficePin');
            showPinBox();
            showMessage('Invalid PIN. Please try again.', 'error');
          } else {
            showMessage(error.message, 'error');
          }
        } finally {
          loading = false;
        }
      }

      async function handleStatus(recordId, status, routeCard) {
        if (busy) return;
        busy = true;
        const spotSelect = routeCard.querySelector('select[data-action="spot"]');
        const spotId = spotSelect ? spotSelect.value : '';
        try {
          await api(`/api/office/route/${recordId}/status`, {
            method: 'POST',
            body: JSON.stringify({ screen: currentScreen, status, spotId, note: 'Office status button' }),
          });
          showMessage(`Changed to ${status}.`, 'success');
          await loadOffice(true);
        } catch (error) {
          showMessage(error.message, 'error');
        } finally {
          busy = false;
        }
      }

      async function loadOverride() {
        if (!officePin) return;
        try {
          const data = await api('/api/office/screen-override');
          renderOverride(data);
        } catch (error) {
          if (error.status !== 401) showMessage(error.message, 'error');
        }
      }

      function renderOverride(data) {
        const bar = document.getElementById('override-bar');
        const label = document.getElementById('override-label');
        const active = data.override || 'auto';
        bar.querySelectorAll('button[data-override]').forEach((button) => {
          button.classList.toggle('active', button.dataset.override === active);
        });
        if (data.override) {
          label.textContent = `Public screen: OVERRIDDEN to ${SCREEN_TITLES[data.override] || data.override} (until midnight)`;
        } else {
          label.textContent = `Public screen: Auto (currently ${SCREEN_TITLES[data.scheduledScreen] || data.scheduledScreen})`;
        }
      }

      async function setOverride(screen) {
        if (busy) return;
        busy = true;
        try {
          const data = await api('/api/office/screen-override', {
            method: 'POST',
            body: JSON.stringify({ screen }),
          });
          renderOverride(data);
          showMessage(screen === 'auto' ? 'Public screen back to Auto.' : `Public screen overridden to ${SCREEN_TITLES[screen] || screen}.`, 'success');
        } catch (error) {
          showMessage(error.message, 'error');
        } finally {
          busy = false;
        }
      }

      async function handleSpot(recordId, spotId) {
        if (busy) return;
        busy = true;
        try {
          await api(`/api/office/route/${recordId}/spot`, {
            method: 'POST',
            body: JSON.stringify({ screen: currentScreen, spotId }),
          });
          showMessage('Spot updated.', 'success');
          await loadOffice(true);
        } catch (error) {
          showMessage(error.message, 'error');
        } finally {
          busy = false;
        }
      }

      function openModal(modalEl) { modalEl.classList.remove('hidden'); }
      function closeModal(modalEl) { modalEl.classList.add('hidden'); }

      async function openTemplatePicker(recordId, routeName) {
        if (busy) return;
        const modal = document.getElementById('template-modal');
        const list = document.getElementById('template-modal-list');
        document.getElementById('template-modal-title').textContent = `Text Parents: ${routeName}`;
        document.getElementById('template-modal-subtitle').textContent = 'Choose a message to send.';
        list.innerHTML = '<p class="modal-subtitle">Loading templates...</p>';
        openModal(modal);
        try {
          const [templatesData, sentData] = await Promise.all([
            api('/api/office/templates'),
            api(`/api/office/route/${recordId}/sent-templates-today`),
          ]);
          const templates = templatesData.templates || [];
          if (!templates.length) {
            list.innerHTML = '<p class="modal-subtitle">No text templates are set up yet. Add one on /setup.html.</p>';
            return;
          }
          const sentAtByTemplateId = new Map((sentData.sent || []).map((entry) => [entry.templateId, entry.sentAt]));
          list.innerHTML = templates.map((template) => {
            const sentAt = sentAtByTemplateId.get(template.id);
            const warning = sentAt ? `<div class="template-already-sent">⚠ Already sent to this bus today at ${formatTime(sentAt)}</div>` : '';
            return `
              <button type="button" class="template-option" data-action="pick-template" data-id="${escapeHtml(recordId)}" data-name="${escapeHtml(routeName)}" data-template-id="${escapeHtml(template.id)}" data-template-name="${escapeHtml(template.name)}" data-already-sent="${sentAt ? '1' : ''}">
                <div class="template-name">${escapeHtml(template.name)}</div>
                <div class="template-preview">${escapeHtml(renderPreviewText(template.body, routeName))}</div>
                ${warning}
              </button>
            `;
          }).join('');
        } catch (error) {
          list.innerHTML = `<p class="modal-subtitle">${escapeHtml(error.message)}</p>`;
        }
      }

      // Client-side approximation just for the picker preview text - the server renders the exact
      // message (with the real send-time timestamp) in the confirm dialog before anything sends.
      function renderPreviewText(body, routeName) {
        return String(body || '').replace(/\{name\}/g, routeName).replace(/\{time\}/g, 'now');
      }

      async function sendWithTemplate(recordId, routeName, templateId, templateName, alreadySent) {
        if (busy) return;
        busy = true;
        closeModal(document.getElementById('template-modal'));
        try {
          const preview = await api(`/api/office/route/${recordId}/notify/preview`, {
            method: 'POST',
            body: JSON.stringify({ templateId }),
          });
          const groupSuffix = preview.groupName ? ` (texting group "${preview.groupName}")` : '';
          if (!preview.count) {
            showMessage(`No text-able parent numbers found for ${routeName}${groupSuffix}.`, 'error');
            return;
          }
          const dupWarning = alreadySent === '1' ? `⚠ "${templateName}" was already sent to this bus today. Send it again?\n\n` : '';
          const confirmed = window.confirm(
            dupWarning +
            `Text ${preview.count} parent(s) on the ${routeName} bus${groupSuffix}?\n\n"${preview.message}"` +
            (preview.sandbox ? '\n\n(Sandbox mode: no real texts will be sent.)' : '')
          );
          if (!confirmed) return;
          const result = await api(`/api/office/route/${recordId}/notify/send`, {
            method: 'POST',
            body: JSON.stringify({ screen: currentScreen, templateId: preview.templateId, message: preview.message, confirmationToken: preview.confirmationToken }),
          });
          if (result.sandbox) {
            showMessage(`Sandbox mode: would have texted ${result.texted} parent(s). No real texts were sent.`, 'info');
          } else {
            showMessage(`Texted ${result.texted} parent(s)${result.failed ? `, ${result.failed} failed` : ''}.`, 'success');
          }
          await loadOffice(true);
        } catch (error) {
          showMessage(error.message, 'error');
        } finally {
          busy = false;
        }
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      document.getElementById('pin-form').addEventListener('submit', (event) => {
        event.preventDefault();
        officePin = document.getElementById('pin-input').value.trim();
        window.localStorage.setItem('tbyOfficePin', officePin);
        loadOffice(true);
        loadOverride();
      });

      document.getElementById('override-bar').addEventListener('click', (event) => {
        const target = event.target.closest('button[data-override]');
        if (!target) return;
        setOverride(target.dataset.override);
      });

      document.getElementById('grid').addEventListener('click', (event) => {
        const statusTarget = event.target.closest('button[data-action="status"]');
        if (statusTarget) {
          const routeCard = statusTarget.closest('.route-card');
          handleStatus(statusTarget.dataset.id, statusTarget.dataset.status, routeCard);
          return;
        }
        const notifyTarget = event.target.closest('button[data-action="notify"]');
        if (notifyTarget) {
          openTemplatePicker(notifyTarget.dataset.id, notifyTarget.dataset.name);
        }
      });

      document.getElementById('grid').addEventListener('change', (event) => {
        const target = event.target.closest('select[data-action="spot"]');
        if (!target) return;
        handleSpot(target.dataset.id, target.value);
      });

      document.getElementById('template-modal-list').addEventListener('click', (event) => {
        const target = event.target.closest('button[data-action="pick-template"]');
        if (!target) return;
        sendWithTemplate(target.dataset.id, target.dataset.name, target.dataset.templateId, target.dataset.templateName, target.dataset.alreadySent);
      });

      document.querySelectorAll('.modal-overlay').forEach((overlay) => {
        overlay.addEventListener('click', (event) => {
          if (event.target === overlay || event.target.closest('[data-modal-close]')) closeModal(overlay);
        });
      });

      window.addEventListener('beforeunload', () => {
        if (loadController) loadController.abort();
        if (loadTimer) window.clearInterval(loadTimer);
      });

      setTitle();
      loadOffice(true);
      loadOverride();
      loadTimer = setInterval(() => { loadOffice(false); loadOverride(); }, 30000);
    </script>
  </body>
</html>
