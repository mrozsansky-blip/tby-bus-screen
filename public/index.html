<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBY Bus Screen</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="screen-shell">
      <header class="screen-header">
        <div id="screen-title" class="screen-title">Bus Dismissal</div>
        <div class="meta">
          <span id="clock" class="clock">--:--</span>
          <span id="updated" class="updated">Loading...</span>
        </div>
      </header>

      <section id="error" class="error hidden"></section>
      <section id="bus-grid" class="bus-grid" aria-live="polite"></section>
    </main>

    <script>
      const SCREEN_TITLES = {
        'from-school': 'From School Dismissal',
        'pri-dismissal': 'PRI Dismissal',
        'friday-dismissal': 'Friday Dismissal',
        'current': 'Bus Dismissal',
      };

      const STATUS_CLASS = {
        'Waiting': 'waiting',
        'Arrived': 'arrived',
        'Loading': 'loading',
        'Ready to Board': 'ready',
        'Departed': 'departed',
        'Delayed': 'delayed',
        'Cancelled': 'cancelled',
      };

      const STATUS_LABEL = {
        'Waiting': 'NOT HERE YET',
        'Arrived': 'ARRIVED',
        'Loading': 'LOADING',
        'Ready to Board': 'READY',
        'Departed': 'DEPARTED',
        'Delayed': 'DELAYED',
        'Cancelled': 'CANCELLED',
      };

      function getScreenKey() {
        const path = window.location.pathname.replace(/^\//, '') || 'current';
        if (['current', 'from-school', 'pri-dismissal', 'friday-dismissal'].includes(path)) return path;
        return 'current';
      }

      function setTitle(screenKey = getScreenKey()) {
        const title = SCREEN_TITLES[screenKey] || 'Bus Dismissal';
        document.getElementById('screen-title').textContent = title;
        document.title = title;
      }

      function formatTime(date) {
        return date.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit',
        }).replace(' ', '');
      }

      function updateClock() {
        document.getElementById('clock').textContent = formatTime(new Date());
      }

      function renderRoutes(routes) {
        const grid = document.getElementById('bus-grid');
        if (!routes.length) {
          grid.innerHTML = '<div class="empty">No bus routes are set for this screen.</div>';
          return;
        }

        grid.innerHTML = routes.map((route) => {
          const status = route.status || 'Waiting';
          const statusClass = STATUS_CLASS[status] || 'waiting';
          const statusLabel = STATUS_LABEL[status] || status.toUpperCase();
          const spot = route.spot ? route.spot.toUpperCase() : '';
          return `
            <article class="bus-card ${statusClass}">
              <div class="bus-name">${escapeHtml(route.name)}</div>
              <div class="bus-main">
                <div class="bus-status">${escapeHtml(statusLabel)}</div>
                ${spot ? `<div class="bus-spot">${escapeHtml(spot)}</div>` : ''}
              </div>
            </article>
          `;
        }).join('');

        applyBusNameColors(routes);
      }

      // Colors each bus's name banner to match its actual bus color (route.color, e.g. "Red",
      // "Blue", set on /setup.html or synced from Airtable's "Bus Color" field) instead of the
      // flat gray default. Applied after the fact via the CSS OM (not string-interpolated into the
      // HTML above) so an unset or bogus color value is simply ignored by the browser rather than
      // risking a broken/injected style attribute.
      function applyBusNameColors(routes) {
        const cards = document.querySelectorAll('#bus-grid .bus-card');
        routes.forEach((route, index) => {
          const nameEl = cards[index] ? cards[index].querySelector('.bus-name') : null;
          if (!nameEl) return;
          const color = String(route.color || '').trim();
          if (!color) return;
          nameEl.style.backgroundColor = color;
          nameEl.style.color = pickReadableTextColor(nameEl);
        });
      }

      // Picks black or white text based on the banner's actual rendered background (read back via
      // getComputedStyle, so this works the same whether route.color was a hex code or a named
      // color like "Yellow") - keeps light bus colors from rendering as white-on-white.
      function pickReadableTextColor(el) {
        const rgb = getComputedStyle(el).backgroundColor.match(/[\d.]+/g);
        if (!rgb) return '';
        const [r, g, b] = rgb.map(Number);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return luminance > 0.6 ? '#111' : '#fff';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function loadRoutes(forceFresh = false) {
        const screen = getScreenKey();
        const errorBox = document.getElementById('error');
        try {
          const fresh = forceFresh ? '?fresh=1' : '';
          const response = await fetch(`/api/routes/${screen}${fresh}`, { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not load bus routes.');

          errorBox.classList.add('hidden');
          setTitle(data.screen || screen);
          renderRoutes(data.routes || []);
          document.getElementById('updated').textContent = `Updated ${formatTime(new Date(data.updatedAt))}`;
        } catch (error) {
          errorBox.textContent = error.message;
          errorBox.classList.remove('hidden');
        }
      }

      function connectInstantRefresh() {
        if (!window.EventSource) return;
        const source = new EventSource('/events');
        source.onmessage = () => loadRoutes(true);
        source.onerror = () => {
          // The backup timer keeps the board fresh even if the live connection drops.
        };
      }

      setTitle();
      updateClock();
      loadRoutes();
      connectInstantRefresh();
      setInterval(updateClock, 1000);
      setInterval(() => loadRoutes(true), 10000);
    </script>
  </body>
</html>
