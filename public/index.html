<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBY Bus Screen</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="screen-shell">
      <header class="screen-header">
        <div id="screen-title" class="screen-title">Bus Dismissal</div>
        <div class="meta">
          <span id="clock" class="clock">--:--</span>
          <span id="updated" class="updated">Loading...</span>
        </div>
      </header>

      <section id="error" class="error hidden"></section>
      <section id="bus-grid" class="bus-grid" aria-live="polite"></section>
    </main>

    <div id="bulletin-view" class="bulletin-view hidden">
      <img id="bulletin-image" class="bulletin-media hidden" alt="" />
      <embed id="bulletin-pdf" class="bulletin-media hidden" type="application/pdf" />
      <div id="bulletin-empty" class="bulletin-empty hidden">Bulletin screen - upload a file from Office → Bulletin to show something here.</div>
    </div>

    <script>
      const SCREEN_TITLES = {
        'from-school': 'From School Dismissal',
        'pri-dismissal': 'PRI Dismissal',
        'friday-dismissal': 'Friday Dismissal',
        'bulletin': 'Announcement',
        'current': 'Bus Dismissal',
      };

      const STATUS_CLASS = {
        'Waiting': 'waiting',
        'Arrived': 'arrived',
        'Loading': 'loading',
        'Ready to Board': 'ready',
        'Departed': 'departed',
        'Delayed': 'delayed',
        'Cancelled': 'cancelled',
      };

      const STATUS_LABEL = {
        'Waiting': 'NOT HERE YET',
        'Arrived': 'ARRIVED',
        'Loading': 'LOADING',
        'Ready to Board': 'READY',
        'Departed': 'DEPARTED',
        'Delayed': 'DELAYED',
        'Cancelled': 'CANCELLED',
      };

      function getScreenKey() {
        const path = window.location.pathname.replace(/^\//, '') || 'current';
        if (['current', 'from-school', 'pri-dismissal', 'friday-dismissal', 'bulletin'].includes(path)) return path;
        return 'current';
      }

      function setTitle(screenKey = getScreenKey()) {
        const title = SCREEN_TITLES[screenKey] || 'Bus Dismissal';
        document.getElementById('screen-title').textContent = title;
        document.title = title;
      }

      function formatTime(date) {
        return date.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit',
        }).replace(' ', '');
      }

      function updateClock() {
        document.getElementById('clock').textContent = formatTime(new Date());
      }

      function renderRoutes(routes) {
        const grid = document.getElementById('bus-grid');
        if (!routes.length) {
          grid.innerHTML = '<div class="empty">No bus routes are set for this screen.</div>';
          return;
        }

        grid.innerHTML = routes.map((route) => {
          const status = route.status || 'Waiting';
          const statusClass = STATUS_CLASS[status] || 'waiting';
          const statusLabel = STATUS_LABEL[status] || status.toUpperCase();
          const spot = route.spot ? route.spot.toUpperCase() : '';
          return `
            <article class="bus-card ${statusClass}">
              <div class="bus-name">${escapeHtml(route.name)}</div>
              <div class="bus-main">
                <div class="bus-status">${escapeHtml(statusLabel)}</div>
                ${spot ? `<div class="bus-spot">${escapeHtml(spot)}</div>` : ''}
              </div>
            </article>
          `;
        }).join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Tracks which bulletin file is currently on screen (filename + upload timestamp) so the
      // 10-second poll below doesn't re-fetch/re-flash the image or PDF unless it actually changed.
      let lastBulletinKey = '';

      function showBulletinView() {
        document.querySelector('.screen-shell').classList.add('hidden');
        document.getElementById('bulletin-view').classList.remove('hidden');
      }

      function hideBulletinView() {
        document.getElementById('bulletin-view').classList.add('hidden');
        document.querySelector('.screen-shell').classList.remove('hidden');
        lastBulletinKey = '';
      }

      async function renderBulletin() {
        showBulletinView();
        const img = document.getElementById('bulletin-image');
        const pdf = document.getElementById('bulletin-pdf');
        const empty = document.getElementById('bulletin-empty');
        try {
          const response = await fetch('/api/bulletin', { cache: 'no-store' });
          const meta = await response.json();
          if (!response.ok) throw new Error(meta.error || 'Could not load the bulletin file.');

          if (!meta.filename) {
            img.classList.add('hidden');
            pdf.classList.add('hidden');
            empty.textContent = 'Bulletin screen - upload a file from Office → Bulletin to show something here.';
            empty.classList.remove('hidden');
            lastBulletinKey = '';
            return;
          }

          const key = `${meta.filename}-${meta.uploadedAt}`;
          empty.classList.add('hidden');
          if (key === lastBulletinKey) return; // already showing this exact file
          lastBulletinKey = key;

          if (meta.mimeType === 'application/pdf') {
            img.classList.add('hidden');
            pdf.src = meta.url;
            pdf.classList.remove('hidden');
          } else {
            pdf.classList.add('hidden');
            img.src = meta.url;
            img.classList.remove('hidden');
          }
        } catch (error) {
          img.classList.add('hidden');
          pdf.classList.add('hidden');
          empty.textContent = error.message;
          empty.classList.remove('hidden');
          lastBulletinKey = '';
        }
      }

      async function loadRoutes(forceFresh = false) {
        const screen = getScreenKey();
        const errorBox = document.getElementById('error');
        try {
          const fresh = forceFresh ? '?fresh=1' : '';
          const response = await fetch(`/api/routes/${screen}${fresh}`, { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Could not load bus routes.');

          errorBox.classList.add('hidden');
          setTitle(data.screen || screen);
          if (data.screen === 'bulletin') {
            await renderBulletin();
          } else {
            hideBulletinView();
            renderRoutes(data.routes || []);
          }
          document.getElementById('updated').textContent = `Updated ${formatTime(new Date(data.updatedAt))}`;
        } catch (error) {
          errorBox.textContent = error.message;
          errorBox.classList.remove('hidden');
        }
      }

      function connectInstantRefresh() {
        if (!window.EventSource) return;
        const source = new EventSource('/events');
        source.onmessage = () => loadRoutes(true);
        source.onerror = () => {
          // The backup timer keeps the board fresh even if the live connection drops.
        };
      }

      setTitle();
      updateClock();
      loadRoutes();
      connectInstantRefresh();
      setInterval(updateClock, 1000);
      setInterval(() => loadRoutes(true), 10000);
    </script>
  </body>
</html>
